# Compiles every module and runs every unit test, on every push and pull
# request.
#
# Split out of what used to be a single `build.yml` running the full
# `./gradlew build` (test + lint + assembleRelease + a native-library
# alignment check) on every push and PR. That full build is expensive enough,
# run that often, to burn through GitHub Actions spending fast — this repo's
# CI was regularly failing to even get a runner assigned because of it
# ("recent account payments have failed or your spending limit needs to be
# increased"). Compiling and assembling a release artifact on every commit
# was never actually needed to know whether the code is correct; running the
# unit tests and Android lint is. So CI now only verifies — see lint.yml for
# the other half — and an actual build (`assembleRelease`/`bundleRelease`) is
# something a person runs deliberately, the same way docs/RELEASING.md
# already described it, or `release.yml` does it once, on a tag push, when a
# release is actually being cut.
name: Test

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow only compiles and tests; it has no business
# pushing, tagging or commenting, and a token that cannot do those things
# cannot be talked into doing them by something that ends up on the
# classpath.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch. Cancelling the
# old one is free; letting it finish only produces an answer about code
# nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper JAR is a binary in the repository that the build
      # executes. gradle-wrapper.properties already pins a distribution
      # checksum, which covers what the wrapper downloads; this covers the
      # wrapper itself.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 21 rather than the newest available. Everything here targets JVM 11
      # and nothing needs a modern JDK, so the version is chosen to be one
      # every contributor already has rather than one they must go and fetch.
      - name: Set up the JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # `test`, not `build` or `check`: this job's only job is "does every
      # test pass" — lint is a separate workflow so either can be re-run,
      # cached and read on its own.
      - name: Run every unit test
        run: ./gradlew test --stacktrace

      # Line coverage for the pure-JVM modules, the only ones with Kover
      # applied so far (#284). Report-only: read it to pick what to test
      # next; nothing fails on a number yet.
      - name: Coverage report
        run: ./gradlew koverHtmlReport koverXmlReport --stacktrace

      - name: Keep the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            **/build/reports/kover/
          retention-days: 14
          if-no-files-found: ignore

      # The console output says which test failed; these say what it
      # expected. Kept only on failure, since a green run's reports are of no
      # interest and this repository has hundreds of them.
      - name: Keep the reports from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # AGENTS.md's "bump on every PR" rule (#275). versionCode is what gates the
  # OTA channel — UpdateClient only ever moves forward — so a PR that changes
  # what ships without raising it produces a release phones can't tell apart
  # from the last one. A job of its own rather than a step above: it needs
  # the full history instead of a shallow clone, no JDK, and should say
  # "forgot the bump" separately from "a test failed".
  #
  # Dependabot's PRs are exempt (#282): it can't bump the version itself, and
  # a library update belongs to whatever release next goes out, which carries
  # its own bump. Keyed on the PR's author rather than github.actor, so a
  # human pushing to a Dependabot branch doesn't change the answer.
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # app-child depends on every other module, so anything outside the
      # paths below reaches the APK. Tests, docs, CI config and the store
      # listing don't, which matches AGENTS.md's skip list.
      #
      # Reads versionCode with a regex rather than from Gradle: running
      # Gradle twice (base and head) would cost more than the rest of this
      # workflow. If the line is ever reformatted past the regex, this fails
      # saying so rather than passing silently.
      - name: Require a versionCode increase when shipped code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          shipped=$(git diff --name-only "$BASE_SHA"...HEAD \
            | grep -vE '(^|/)src/test/|\.md$|^docs/|^\.github/|^\.claude/|^play/' || true)
          if [ -z "$shipped" ]; then
            echo "No shipped code changed; no bump needed."
            exit 0
          fi

          read_code() {
            grep -oE '^\s*versionCode = [0-9]+' | grep -oE '[0-9]+$' || true
          }
          base=$(git show "$BASE_SHA:app-child/build.gradle.kts" | read_code)
          head=$(read_code < app-child/build.gradle.kts)
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "::error file=app-child/build.gradle.kts::Could not find 'versionCode = N'; update this check's regex."
            exit 1
          fi

          if [ "$head" -le "$base" ]; then
            echo "::error file=app-child/build.gradle.kts::This PR changes shipped code but versionCode is still $head (base $base). Bump versionCode and versionName; see AGENTS.md."
            echo "Shipped files changed:"
            echo "$shipped"
            exit 1
          fi
          echo "versionCode $base -> $head"
