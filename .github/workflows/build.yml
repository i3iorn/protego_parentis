# Compiles the project and runs every test, on every push and pull request.
#
# Until this existed nothing checked this repository except a person remembering
# to. Two releases' worth of sync changes reached main without having been
# compiled once, and the bugs they carried were found by reading rather than by
# anything failing. That is the gap this closes.
name: Build

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow builds and tests; it has no business pushing, tagging
# or commenting, and a token that cannot do those things cannot be talked into
# doing them by something that ends up on the classpath.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch. Cancelling the
# old one is free; letting it finish only produces an answer about code nobody
# has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The wrapper JAR is a binary in the repository that the build executes.
      # gradle-wrapper.properties already pins a distribution checksum, which
      # covers what the wrapper downloads; this covers the wrapper itself.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # 21 rather than the newest available. Everything here targets JVM 11 and
      # nothing needs a modern JDK, so the version is chosen to be one every
      # contributor already has rather than one they must go and fetch.
      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` and not `test`: it also runs Android lint and assembles the
      # release variant, which is where R8 gets a chance to object to something
      # the debug build was happy with. See the Building section of the README.
      - name: Build, test and lint
        run: ./gradlew build --stacktrace

      # 16 KB page-size compatibility.
      #
      # Google's guidance is explicit that an app written only in Java or Kotlin,
      # dependencies included, already supports 16 KB pages and needs no rebuild.
      # This app has no NDK code and no dependency that ships a native library, so
      # there is nothing here to align — checking the alignment of an APK with no
      # .so in it would be a check that can never fail and never means anything.
      #
      # What is worth checking is the assumption underneath that: whether a native
      # library has appeared. The day one does, alignment becomes a real question,
      # and it should be answered here rather than discovered from a Play
      # rejection. So this passes silently while there are none, and runs the real
      # alignment check the moment there is one.
      - name: Check native libraries for 16 KB alignment
        run: |
          set -euo pipefail
          apk=app-child/build/outputs/apk/release/app-child-release-unsigned.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced; this check cannot run."
            exit 1
          fi
          libs=$(unzip -Z1 "$apk" 'lib/*' 2>/dev/null || true)
          if [ -z "$libs" ]; then
            echo "No native libraries in the release APK, so 16 KB pages are supported by construction."
            exit 0
          fi
          echo "Native libraries found:"
          echo "$libs"
          zipalign=$(find "${ANDROID_HOME:?}/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          if [ -z "$zipalign" ]; then
            echo "::error::A native library has appeared and zipalign is not available to check its alignment. See https://developer.android.com/guide/practices/page-sizes"
            exit 1
          fi
          # -P 16 is the page-size alignment; 4 is the ordinary entry alignment.
          "$zipalign" -c -P 16 -v 4 "$apk"

      # The console output says which test failed; these say what it expected.
      # Kept only on failure, since a green run's reports are of no interest and
      # this repository has 640 of them.
      - name: Keep the reports from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
