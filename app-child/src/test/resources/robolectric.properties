# The API level every Robolectric test runs at.
#
# Pinned rather than inherited from targetSdk, for two reasons.
#
# The first is version skew. Robolectric only knows the API levels it shipped
# with; 4.16.1 stopped at 36 while this app already targeted 37, so every
# unpinned test failed before its body ran. 4.17 knows 37, but raising
# targetSdk ahead of a Robolectric release is normal, so the pin is what keeps
# the two from being coupled next time.
#
# The second is that a fixed level is worth having anyway. A test that quietly
# changes which Android it runs on when someone bumps targetSdk is a test whose
# result nobody can reason about, and Robolectric downloads an image per level,
# so an unpinned one also costs a fresh download on every bump.
#
# 36 is a real level for this app: minSdk is 33, so it is inside the supported
# range rather than a convenient fiction.
sdk=36
#
# The test application stands up a WorkManager before DementorApplication
# schedules its workers — see TestApplication's own doc comment for why the
# startup provider's init never reaches a Robolectric process.
application=dev.schrammel.protego_parentis.TestApplication
