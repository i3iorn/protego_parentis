[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
appcompat = "1.8.0"
swiperefreshlayout = "1.1.0"
json = "20260814"
work = "2.12.0"
biometric = "1.1.0"
camerax = "1.3.4"
zxing = "3.5.4"
robolectric = "4.18"
kover = "0.9.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Pull-to-refresh: the standard gesture, on the one screen a parent opens
# expecting news from the other phone.
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
# The real org.json, for unit tests. Android ships only stubs that throw, so a
# store that serialises with JSONObject is otherwise untestable off-device.
json = { group = "org.json", name = "json", version.ref = "json" }
# Runs Android-dependent unit tests on the JVM against a real framework
# implementation, so a class that takes a Context is testable without a device.
# Everything in app-child/sync does, which is why nothing there had a test and
# why every sync defect so far was found by reading rather than by failing.
#
# Stable releases only: a test harness that is itself unreleased is not a
# foundation for the tests. See app-child/src/test/resources/robolectric.properties
# for why the SDK is pinned rather than taken from targetSdk.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Periodic background polling on a parent phone. The plain runtime rather than
# -ktx: this project has no coroutines and a synchronous Worker is the right fit.
androidx-work = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# Unit tests: stands up an in-memory WorkManager the production startup
# provider would otherwise initialise (Robolectric does not run it).
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# The fingerprint and face prompt, and the check for whether the phone has one.
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Reading a QR code. Two pieces and no more: CameraX for a preview and a stream of
# frames, and ZXing's decoder for turning one into a string. Both are libraries
# rather than SDKs — no network, no telemetry, nothing that phones anywhere — which
# is what lets the listing keep saying this app carries no analytics and no
# third-party services.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Line coverage for the pure-JVM modules (#284). Report-only: CI uploads it,
# nothing fails on a threshold yet.
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
